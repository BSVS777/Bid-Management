{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<h1>Iniciar sesión</h1>
<form method="post" action="/login">
  <p><label for="username">Usuario</label><br>
  <input type="text" id="username" name="username" value="{{ username }}" autocomplete="username" required></p>
  <p><label for="password">Contraseña</label><br>
  <input type="password" id="password" name="password" autocomplete="current-password" required></p>
  <button type="submit">Entrar</button>
</form>
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
{% endblock %}
