{% extends "base.html" %}
{% block title %}Editar licitación{% endblock %}
{% block content %}
<h1>Editar licitación #{{ tender_id }}</h1>
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
{% if editable %}
<form method="post" action="/tenders/{{ tender_id }}/edit">
  <p><label for="code">Código</label><br>
  <input type="text" id="code" name="code" value="{{ form.code }}" maxlength="30" required></p>
  <p><label for="title">Título</label><br>
  <input type="text" id="title" name="title" value="{{ form.title }}" maxlength="200" required></p>
  <p><label for="budget_crc">Presupuesto (CRC)</label><br>
  <input type="text" id="budget_crc" name="budget_crc" value="{{ form.budget_crc }}" inputmode="decimal" required></p>
  <p><label for="closing_at">Fecha y hora de cierre</label><br>
  <input type="datetime-local" id="closing_at" name="closing_at" value="{{ form.closing_at }}" required></p>
  <button type="submit">Guardar</button>
  <a href="/tenders">Cancelar</a>
</form>
{% else %}
<p><a href="/tenders">Volver a licitaciones</a></p>
{% endif %}
{% endblock %}
